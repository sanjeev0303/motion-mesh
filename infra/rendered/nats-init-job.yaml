apiVersion: batch/v1
kind: Job
metadata:
  name: motionmesh-nats-init
  namespace: motionmesh
  labels:
    app: nats-init
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: nats-init
    spec:
      serviceAccountName: motionmesh-api
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: nats-init
          image: 425456324653.dkr.ecr.ap-south-1.amazonaws.com/motionmesh-api:55eecd0
          imagePullPolicy: Always
          command:
            - /app/nats-init
          env:
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: motionmesh-config
                  key: QUEUE_URL
          envFrom:
            - secretRef:
                name: motionmesh-secrets
            - configMapRef:
                name: motionmesh-config
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
