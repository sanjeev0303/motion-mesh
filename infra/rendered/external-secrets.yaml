apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: motionmesh
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: motionmesh-secrets
  namespace: motionmesh
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: motionmesh-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .db_username }}:{{ .db_password | urlquery }}@motionmesh-benchmark.cd0ikga68ydm.ap-south-1.rds.amazonaws.com:5432/motionmesh?sslmode=require"
        DB_HOST: "motionmesh-benchmark.cd0ikga68ydm.ap-south-1.rds.amazonaws.com:5432"
        DB_PORT: "5432"
        DB_NAME: "motionmesh"
        DB_USER: "{{ .db_username }}"
        REDIS_URL: "redis://{{ .redis_host }}:{{ .redis_port }}"
        CLOUDFRONT_KEY_ID: "{{ .cf_key_id }}"
        CLOUDFRONT_PRIVATE_KEY: "{{ .cf_private_key }}"
  data:
    - secretKey: db_username
      remoteRef:
        key: arn:aws:secretsmanager:ap-south-1:718314448702:secret:rds!db-27a6fbe6-aea9-444a-89f6-9538312828e1-0hNEx1
        property: username
    - secretKey: db_password
      remoteRef:
        key: arn:aws:secretsmanager:ap-south-1:718314448702:secret:rds!db-27a6fbe6-aea9-444a-89f6-9538312828e1-0hNEx1
        property: password
    
    # Cloudfront key
    - secretKey: cf_key_id
      remoteRef:
        key: arn:aws:secretsmanager:ap-south-1:718314448702:secret:motionmesh/benchmark/cloudfront-signing-20260814172016409300000002-FsclOP
        property: key_id
    - secretKey: cf_private_key
      remoteRef:
        key: arn:aws:secretsmanager:ap-south-1:718314448702:secret:motionmesh/benchmark/cloudfront-signing-20260814172016409300000002-FsclOP
        property: private_key

    
    # Redis
    - secretKey: redis_host
      remoteRef:
        key: arn:aws:secretsmanager:ap-south-1:718314448702:secret:motionmesh/benchmark/redis-20260814172017056200000006-zeEZ8E
        property: host
    - secretKey: redis_port
      remoteRef:
        key: arn:aws:secretsmanager:ap-south-1:718314448702:secret:motionmesh/benchmark/redis-20260814172017056200000006-zeEZ8E
        property: port
