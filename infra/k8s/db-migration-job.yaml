apiVersion: batch/v1
kind: Job
metadata:
  name: motionmesh-db-migration
  namespace: motionmesh
  labels:
    app: db-migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: db-migration
    spec:
      serviceAccountName: motionmesh-api
      automountServiceAccountToken: false
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          envFrom:
            - secretRef:
                name: motionmesh-secrets
          command:
            - sh
            - -c
            - |
              echo "Waiting for Aurora PostgreSQL to be reachable..."
              ATTEMPTS=0
              MAX_ATTEMPTS=60
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME"; do
                ATTEMPTS=$((ATTEMPTS + 1))
                echo "Attempt $ATTEMPTS/$MAX_ATTEMPTS"
                if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
                  echo "Aurora PostgreSQL is unreachable."
                  echo "DB_HOST: $DB_HOST"
                  echo "DB_PORT: $DB_PORT"
                  echo "DB_NAME: $DB_NAME"
                  exit 1
                fi
                sleep 2
              done
              echo "Aurora is reachable!"
      containers:
        - name: migrate
          # The deploy script must replace this with the worker image or an image containing golang-migrate
          image: ${MIGRATION_IMAGE_URI}
          command:
            - /bin/sh
            - -c
            - |
              migrate -path /app/migrations -database "$DATABASE_URL" up
          envFrom:
            - secretRef:
                name: motionmesh-secrets
            - configMapRef:
                name: motionmesh-config
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
